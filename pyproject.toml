[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ermes"
version = "2.1.0"
description = "Enterprise Knowledge Hub — RAG locale per documentazione aziendale"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.22",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "python-docx>=1.1",
    "pypdf>=5",
    "python-dotenv>=1.0",
    "filelock>=3.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Reranking neurale (cross-encoder): richiede torch, installato a parte
# per non gonfiare il deploy base. Senza questo extra il reranker
# ripiega automaticamente sul motore lessicale.
neural = [
    "sentence-transformers>=3.0",
]
# Backend PostgreSQL multi-utente (ERMES_DATABASE_URL). Vedi
# docs/POSTGRES_MIGRATION_PLAN.md per lo stato della migrazione.
postgres = [
    "psycopg[binary]>=3.1",
]
# Metriche Prometheus native (/metrics). L'extra resta per compatibilita' con
# chi lo installava, ma prometheus-client e' una dipendenza obbligatoria sopra:
# la "degradazione silenziosa" che questo commento dichiarava non era mai stata
# implementata — `api/__init__.py` importa `core.metrics` all'avvio, quindi
# senza il pacchetto il container non partiva affatto.
metrics = [
    "prometheus-client>=0.20",
]
# Il motore storico WinSarp (legacy_winsarp/), spento salvo
# ERMES_ENABLE_LEGACY_WINSARP. Vedi requirements-legacy.txt.
legacy = [
    "llama-index-core>=0.11",
    "llama-index-llms-ollama>=0.4",
    "llama-index-embeddings-ollama>=0.4",
    "llama-index-vector-stores-chroma>=0.3",
    "llama-index-readers-file>=0.3",
    "chromadb>=1.5",
    "ollama>=0.4",
]
# Benchmark di performance (pytest per i test in tests/test_performance.py).
benchmark = [
    "pytest-benchmark>=4.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Il motore formule WinSarp e' codice storico congelato (vedi
# legacy_winsarp/README.md): non viene piu' modificato e non fa parte del
# percorso di prodotto. Analizzarlo produceva 551 violazioni su 616 totali,
# che seppellivano le 65 reali del prodotto e rendevano il gate inutilizzabile.
exclude = ["legacy_winsarp"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "SIM"]
ignore = [
    "E501",     # line too long — handled by formatter
    "SIM117",   # multiple with statements — readability preference
    "SIM108",   # ternary instead of if-else — not always clearer
    "SIM114",   # combine if-conditions — not always clearer
    "SIM115",   # open instead of Path.open — context-specific
    "N999",     # module name invalid — not applicable
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "S311", "E402", "I001", "E701", "E702", "N802"]
# Gli script di utilita' (generatori di fixture/demo) usano nomi MAIUSCOLI
# per le costanti locali: e' una scelta di leggibilita' del loro dominio.
"scripts/*.py" = ["E402", "E722", "N802", "N806"]
"evaluation/*.py" = ["E402", "F841"]
# I router vengono importati dopo la creazione dell'app e dei middleware, per
# evitare import circolari: e' il pattern FastAPI abituale, non un difetto.
"api/__init__.py" = ["E402"]
# Il package config/ espone property con nome MAIUSCOLO per mantenere
# l'API di compatibilita' cfg.DOCS_DIR ecc. ereditata dal vecchio config.py
# (ignorato con la stessa regola quando era un modulo singolo).
"config/*" = ["N802"]
"*.pyi" = ["N"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
markers = [
    # Test che richiedono un PostgreSQL live (container ermes-pg o ERMES_TEST_DATABASE_URL);
    # vengono saltati automaticamente se il DB non è raggiungibile.
    "postgres: requires a live PostgreSQL server",
]
# WinSarp e' un verticale legacy isolato in legacy_winsarp/ (docs/ROADMAP_V2.md,
# Fase A) e non e' piu' incluso in testpaths. Il suo test_winsarp_robustness.py
# fa riferimento a helper gia' rimossi dal contratto pubblico del modulo prima
# dell'isolamento; l'ignore resta qui solo per chi esegue
# `pytest legacy_winsarp/tests` esplicitamente.
addopts = ["--ignore=legacy_winsarp/tests/test_winsarp_robustness.py"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["backups", ".venv", "legacy_winsarp"]

# `exclude` non basta: mypy entra comunque in legacy_winsarp seguendo gli
# import dal percorso di prodotto, e quel motore congelato — fuori ambito per
# dichiarazione esplicita nel threat model, raggiungibile solo con
# ENABLE_LEGACY_WINSARP=1 — produceva da solo 40 dei 92 errori, rendendo
# impossibile distinguere le segnalazioni che riguardano il prodotto.
[[tool.mypy.overrides]]
module = "legacy_winsarp.*"
ignore_errors = true

# ---------------------------------------------------------------------------
# Debito di tipizzazione: estinto l'11 settembre 2026.
#
# Qui c'era un elenco di 18 moduli esentati dal controllo dei tipi — un
# cricchetto che poteva solo accorciarsi, nato quando rendere mypy bloccante
# di colpo avrebbe richiesto 48 correzioni in una volta. Le 48 correzioni sono
# state fatte (annotazioni mancanti, Optional impliciti, ritorni Any resi
# espliciti, una variabile ridefinita, un dizionario tipizzato troppo stretto)
# senza un solo `type: ignore`. Il controllo e' bloccante su tutto il codice
# di prodotto. NON reintrodurre esenzioni per far passare la CI.
