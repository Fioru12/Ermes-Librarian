version: 2
# Minor and patch updates are grouped into one weekly PR per ecosystem.
# Major version jumps (React 19, Vite 8, Python 3.14, ...) are ignored here
# on purpose: they need a deliberate, tested migration, not an automatic PR.
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # FastAPI e' 0.x: ogni minore puo' rompere. La 0.143 raggruppa le rotte
      # in un _IncludedRouter e gli alias /v1 di api/__init__.py non le vedono
      # piu' (28 rotte invece di piu' di 50). Va migrata di proposito.
      - dependency-name: fastapi
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
