name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Esegui deploy dopo i test"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.14"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy bandit pip-audit
      - name: Ruff check
        run: ruff check . --output-format=github
      - name: MyPy check
        run: mypy . --ignore-missing-imports || true
      - name: Bandit security scan
        run: bandit -r api.py api/ config.py core/ -x core/templates,core/evaluation -ll || true
      - name: pip-audit (vulnerability scan)
        run: pip-audit --continue-on-error || true

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Create .env for tests
        run: |
          echo "ERMES_PORT=8502" > .env
          echo "ERMES_HOST=127.0.0.1" >> .env
          echo "OLLAMA_HOST=http://127.0.0.1:11434" >> .env
          echo "ERMES_MODEL=test-model" >> .env
          echo "ERMES_ENABLE_FORMULA_GENERATION=1" >> .env
          echo "ERMES_API_KEY=test-key-123" >> .env
          echo "ERMES_BACKUP_ENABLED=0" >> .env
      - name: Run tests
        run: python -m pytest tests/ -v --timeout=30

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install & test frontend
        run: |
          cd frontend
          npm ci
          npm run build
      - name: Run frontend tests
        run: |
          cd frontend
          npm test

  pre-deploy-backup:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [lint, test, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create backup artifact
        run: |
          mkdir -p deploy-backup
          cp -r data/ermes_knowledge.sqlite3 deploy-backup/ 2>/dev/null || true
          cp config.py deploy-backup/ 2>/dev/null || true
          cp .env deploy-backup/ 2>/dev/null || true
          tar czf deploy-backup.tar.gz deploy-backup/
      - uses: actions/upload-artifact@v4
        with:
          name: pre-deploy-backup
          path: deploy-backup.tar.gz
          retention-days: 30

  docker:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [lint, test, frontend, pre-deploy-backup]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Notify deploy
        run: |
          echo "::notice::Deploy in corso per ${{ github.repository }}@${{ github.sha }}"
          echo "Deploy tag: $(echo ${{ github.sha }} | cut -c1-7)"
      - name: Send deploy notification (Slack)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rocket: Ermes deploy completato\nRepo: ${{ github.repository }}\nSHA: ${{ github.sha }}\nJob: ${{ github.run_id }}"
            }
      - name: Deploy instructions
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════╗"
          echo "║  DEPLOY COMPLETATO                           ║"
          echo "╠══════════════════════════════════════════════╣"
          echo "║  Immagine: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "║  SHA: ${{ github.sha }}"
          echo "║                                              ║"
          echo "║  Pull ed esegui sul server di produzione:    ║"
          echo "║    docker compose pull app                   ║"
          echo "║    docker compose up -d app                  ║"
          echo "╚══════════════════════════════════════════════╝"
