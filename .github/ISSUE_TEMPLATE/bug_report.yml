name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include what you expected instead.
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Ermes version / commit
  - type: dropdown
    id: runtime
    attributes:
      label: How are you running it?
      options: [Docker Compose, Windows launcher, Python from source]
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove document contents, tokens and personal data before pasting.
      render: shell
