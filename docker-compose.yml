services:
  ollama:
    image: ollama/ollama:latest
    container_name: ermes-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks:
      - ermes-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ermes-ai-hub
    ports:
      - "${ERMES_HOST_PORT:-8502}:${ERMES_PORT:-8502}"
    volumes:
      - ./documenti:/app/documenti
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./security:/app/security
      - ./backups:/app/backups
    environment:
      - ERMES_HOST=0.0.0.0
      - ERMES_PORT=${ERMES_PORT:-8502}
      # ATTENZIONE ai nomi. Fino al 10 settembre 2026 qui c'era ERMES_MODEL ed
      # ERMES_EMBED_MODEL, che il codice non legge da nessuna parte: il
      # container girava sempre con i valori predefiniti del config, qualunque
      # cosa si scrivesse. I nomi letti sono questi.
      #
      # I default coincidono con quelli del config, cioe' con cio' che era
      # realmente in vigore: collegare le variabili non deve cambiare di
      # straforo quale modello viene usato. Il container ollama parte VUOTO,
      # quindi va comunque eseguito `docker compose exec ollama ollama pull
      # <modello>` per ciascuno dei due prima del primo uso.
      - ERMES_DEFAULT_MODEL_ID=${ERMES_DEFAULT_MODEL_ID:-llama3.2:latest}
      - ERMES_EMBED_MODEL_ID=${ERMES_EMBED_MODEL_ID:-nomic-embed-text:latest}
      - OLLAMA_HOST=http://ollama:11434
      - ERMES_SCORE_LOW=${ERMES_SCORE_LOW:-0.60}
      - ERMES_SCORE_MED=${ERMES_SCORE_MED:-0.70}
      - ERMES_PROMPT_MAX_CHARS=${ERMES_PROMPT_MAX_CHARS:-2000}
      - ERMES_LOG_RETENTION_DAYS=${ERMES_LOG_RETENTION_DAYS:-30}
      # In container i log vengono raccolti da un aggregatore, non letti
      # a schermo: il formato JSON e' il default qui e non altrove.
      - ERMES_LOG_FORMAT=${ERMES_LOG_FORMAT:-json}
      - ERMES_LOG_LEVEL=${ERMES_LOG_LEVEL:-INFO}
      - ERMES_ENABLE_FORMULA_GENERATION=${ERMES_ENABLE_FORMULA_GENERATION:-0}
      - ERMES_ENABLE_LEGACY_WINSARP=${ERMES_ENABLE_LEGACY_WINSARP:-0}
      - ERMES_LIBRARY_SEMANTIC_SEARCH=${ERMES_LIBRARY_SEMANTIC_SEARCH:-0}
      - ERMES_LIBRARY_ASSISTANT_MODE=${ERMES_LIBRARY_ASSISTANT_MODE:-evidence_only}
      - ERMES_LIBRARY_CLOUD_CONSENT=${ERMES_LIBRARY_CLOUD_CONSENT:-0}
      - ERMES_ASSISTANT_TIMEOUT_SEC=${ERMES_ASSISTANT_TIMEOUT_SEC:-60}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - ERMES_API_KEY=${ERMES_API_KEY:-}
      - ERMES_ADMIN_USERNAME=${ERMES_ADMIN_USERNAME:-admin}
      - ERMES_ADMIN_PASSWORD=${ERMES_ADMIN_PASSWORD:-}
      - ERMES_ADMIN_MAX_UPLOAD_MB=${ERMES_ADMIN_MAX_UPLOAD_MB:-50}
      - ERMES_OIDC_ENABLED=${ERMES_OIDC_ENABLED:-0}
      - ERMES_OIDC_ISSUER=${ERMES_OIDC_ISSUER:-}
      - ERMES_OIDC_CLIENT_ID=${ERMES_OIDC_CLIENT_ID:-}
      - ERMES_OIDC_CLIENT_SECRET=${ERMES_OIDC_CLIENT_SECRET:-}
      - ERMES_OIDC_AUDIENCE=${ERMES_OIDC_AUDIENCE:-}
      - ERMES_RERANKER_ENABLED=${ERMES_RERANKER_ENABLED:-1}
      # Reranker neurale: richiede sentence-transformers nell'immagine
      # (pip install .[neural]); senza, ripiega sul reranker lessicale.
      - ERMES_RERANKER_MODEL=${ERMES_RERANKER_MODEL:-}
      - ERMES_RERANKER_NEURAL=${ERMES_RERANKER_NEURAL:-1}
      - ERMES_SEARCH_CACHE_TTL_SECONDS=${ERMES_SEARCH_CACHE_TTL_SECONDS:-300}
      - ERMES_SEARCH_CACHE_MAX_ENTRIES=${ERMES_SEARCH_CACHE_MAX_ENTRIES:-200}
      - ERMES_DLP_AUDIT_ENABLED=${ERMES_DLP_AUDIT_ENABLED:-1}
      # Database backend: vuoto = SQLite (default). Con il profilo "postgres"
      # impostare la URL del servizio postgres (vedi .env.example).
      - ERMES_DATABASE_URL=${ERMES_DATABASE_URL:-}
      # Token per l'endpoint /metrics: vuoto = /metrics riservata agli admin.
      - ERMES_METRICS_TOKEN=${ERMES_METRICS_TOKEN:-}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-http://langfuse:3000}
      # Chat integrations: library-bound webhooks (Slack HMAC, Teams HMAC, Telegram token)
      # implemented in api/chat_webhooks.py for Ermes Knowledge libraries.
      - ERMES_TEAMS_WEBHOOK_SECRET=${ERMES_TEAMS_WEBHOOK_SECRET:-}
      - ERMES_SLACK_SIGNING_SECRET=${ERMES_SLACK_SIGNING_SECRET:-}
      - ERMES_SLACK_BOT_TOKEN=${ERMES_SLACK_BOT_TOKEN:-}
      - ERMES_TELEGRAM_BOT_TOKEN=${ERMES_TELEGRAM_BOT_TOKEN:-}
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ermes-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

  # Backend PostgreSQL opzionale (deploy multi-utente).
  # Attivazione: docker compose --profile postgres up -d
  # e impostare nel .env:
  #   ERMES_DATABASE_URL=postgresql://ermes:${POSTGRES_PASSWORD:-ermes_change_me}@postgres:5432/ermes
  # Senza questo profilo l'app usa SQLite (nessuna altra configurazione).
  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    container_name: ermes-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ermes}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-ermes_change_me}
      - POSTGRES_DB=${POSTGRES_DB:-ermes}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ermes} -d ${POSTGRES_DB:-ermes}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - ermes-network
    # Il DB non deve essere esposto su porte pubbliche: solo la rete interna.
    # Per accesso dal host (debug): scommentare
    # ports:
    #   - "127.0.0.1:5432:5432"

  # Reverse proxy per esposizione pubblica (SSL automatico con Let's Encrypt)
  # Sostituisci il dominio in scripts/Caddyfile prima di avviare
  caddy:
    profiles: ["public"]
    image: caddy:2-alpine
    container_name: ermes-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - ermes-network
    restart: unless-stopped

networks:
  ermes-network:
    driver: bridge

volumes:
  ollama_data:
  caddy_data:
  caddy_config:
  postgres_data:
