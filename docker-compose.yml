services:
  ermes-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ermes-ai-hub
    ports:
      - "8502:8502"
    volumes:
      - ./documenti:/app/documenti
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
      - ./logs:/app/logs
      - ./security:/app/security
      - ./backups:/app/backups
    environment:
      - ERMES_HOST=0.0.0.0
      - ERMES_PORT=8502
      - ERMES_MODEL=qwen3:8b
      - ERMES_EMBED_MODEL=bge-m3
      - OLLAMA_HOST=http://host.docker.internal:11434
      - ERMES_SCORE_LOW=0.60
      - ERMES_SCORE_MED=0.70
      - ERMES_PROMPT_MAX_CHARS=2000
      - ERMES_LOG_RETENTION_DAYS=30
      - ERMES_ENABLE_FORMULA_GENERATION=1
      - ERMES_API_KEY=${ERMES_API_KEY:-}
      - ERMES_ADMIN_USERNAME=${ERMES_ADMIN_USERNAME:-admin}
      - ERMES_ADMIN_PASSWORD=${ERMES_ADMIN_PASSWORD:-}
      - ERMES_ADMIN_MAX_UPLOAD_MB=50
      - ERMES_AUDIT_SECRET=${ERMES_AUDIT_SECRET:-}
    restart: unless-stopped
    networks:
      - ermes-network
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

networks:
  ermes-network:
    driver: bridge
