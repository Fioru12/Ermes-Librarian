# Default values for ermes-knowledge Helm chart.
# Declare variables to be passed into templates.

replicaCount: 2

image:
  repository: ghcr.io/fioru12/ermes-knowledge
  pullPolicy: IfNotPresent
  tag: "2.3.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8502

ingress:
  enabled: false
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
  hosts:
    - host: ermes.company.internal
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: ermes-knowledge-tls
      hosts:
        - ermes.company.internal

resources:
  limits:
    cpu: 2000m
    memory: 2048Mi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

# Enterprise Configuration
config:
  logLevel: "INFO"
  logFormat: "json"
  assistantMode: "evidence_only"
  cloudConsent: "0"
  semanticSearch: "0"
  rerankerEnabled: "0"
  evidenceVerifier: "0"
  maxUploadMb: 50
  # Storage Backend: "local" (default, PVC-backed) or "s3" — matches
  # config/storage.py::STORAGE_BACKEND. "s3" here was the chart's original
  # default, inherited from a branch with its own (never-merged) S3 storage
  # module; core/storage_provider.py on main needs S3_* creds set below
  # before this can safely switch.
  storageBackend: "local"
  s3BucketName: "ermes-documents"
  s3EndpointUrl: ""
  s3Region: "us-east-1"
  # AES-256-GCM encryption at rest (core/encryption.py), independent of
  # which storage backend is selected above.
  storageEncryptionEnabled: false
  # SIEM: RFC 5424 syslog and/or HMAC-signed HTTPS webhook streaming of the
  # audit log (core/governance.py). Empty by default — local-only audit.
  auditRemoteUrl: ""
  auditSyslogHost: ""
  auditSyslogPort: 514
  # ClamAV in-memory malware scan (core/antivirus.py) on every document
  # upload, connector sync and folder import. Off by default: needs a
  # clamd daemon reachable at clamavHost:clamavPort.
  clamavEnabled: false
  clamavHost: "ermes-clamav"
  clamavPort: 3310
  # Database Backend: PostgreSQL connection string
  databaseUrl: "postgresql://ermes:secret@ermes-postgres:5432/ermes"
  # Ollama service endpoint if internal in cluster
  ollamaHost: "http://ermes-ollama:11434"

secrets:
  adminUsername: "admin"
  adminPassword: ""
  auditSecret: ""
  auditRemoteToken: ""
  s3AccessKeyId: ""
  s3SecretAccessKey: ""
  storageEncryptionKey: ""
  openrouterApiKey: ""

probes:
  liveness:
    httpGet:
      path: /health
      port: 8502
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /health
      port: 8502
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 2

nodeSelector: {}
tolerations: []
affinity: {}
