apiVersion: v1
kind: Service
metadata:
  name: {{ include "ermes-knowledge.fullname" . }}
  labels:
    {{- include "ermes-knowledge.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8502
      protocol: TCP
      name: http
  selector:
    {{- include "ermes-knowledge.selectorLabels" . | nindent 4 }}
