route:
  receiver: webhook
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: webhook
    webhook_configs:
      # Formato JSON generico: funziona con n8n/Zapier, un relay verso
      # Slack/Teams/Discord, o qualunque endpoint HTTP. L'URL arriva da
      # ALERT_WEBHOOK_URL (scritto in questo file dal compose).
      - url_file: /tmp/webhook_url
        send_resolved: true
