global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: ermes
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/ermes_metrics_token
    static_configs:
      # Nome del servizio nel compose e porta interna del container.
      - targets: ["app:8502"]
